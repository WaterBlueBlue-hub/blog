<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#28323c"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d96b29"/>
    </marker>
    <marker id="arrow-up" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#15956f"/>
    </marker>
    <marker id="arrow-down" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2b73b5"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b2a33" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect width="1600" height="800" fill="#ffffff"/>
  <line x1="825" y1="80" x2="825" y2="720" stroke="#e0e5e9" stroke-width="2"/>
  <text x="72" y="105" fill="#56626d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25">薄板涡片</text>
  <text x="890" y="105" fill="#56626d" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="25">x–z 截面</text>

  <!-- left: vortex sheet and coordinate axes -->
  <polygon points="180,520 760,520 640,340 80,340"
           fill="#eef3f6" stroke="#9aa7b1" stroke-width="3" filter="url(#shadow)"/>

  <line x1="180" y1="520" x2="810" y2="520" stroke="#28323c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="826" y="531" fill="#28323c" font-family="Cambria Math, Microsoft YaHei, serif" font-size="28" font-style="italic">x</text>

  <line x1="180" y1="520" x2="35" y2="305" stroke="#28323c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="5" y="286" fill="#28323c" font-family="Cambria Math, Microsoft YaHei, serif" font-size="28" font-style="italic">+y</text>

  <line x1="180" y1="520" x2="180" y2="225" stroke="#28323c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="140" y="207" fill="#28323c" font-family="Cambria Math, Microsoft YaHei, serif" font-size="28" font-style="italic">+z</text>

  <polygon points="482,520 514,520 414,340 382,340"
           fill="#f0a273" fill-opacity="0.24" stroke="#d96b29" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="525" y1="472" x2="438" y2="340" stroke="#d96b29" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text x="540" y="430" fill="#c65c20" font-family="Cambria Math, Microsoft YaHei, serif" font-size="29" font-weight="700">+Γ</text>

  <line x1="482" y1="520" x2="482" y2="578" stroke="#d96b29" stroke-width="2"/>
  <text x="452" y="612" fill="#c65c20" font-family="Cambria Math, Microsoft YaHei, serif" font-size="27" font-style="italic">ξ</text>
  <path d="M482 552 L482 564 M514 552 L514 564 M482 558 L514 558"
        fill="none" stroke="#d96b29" stroke-width="2.2"/>
  <text x="532" y="568" fill="#c65c20" font-family="Cambria Math, Microsoft YaHei, serif" font-size="24">dξ</text>

  <!-- right: x-z cross-section of induced velocity direction -->
  <line x1="890" y1="520" x2="1530" y2="520" stroke="#28323c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="1545" y="531" fill="#28323c" font-family="Cambria Math, Microsoft YaHei, serif" font-size="28" font-style="italic">x</text>

  <line x1="1210" y1="520" x2="1210" y2="350" stroke="#28323c" stroke-width="4" marker-end="url(#arrow-dark)"/>
  <text x="1170" y="332" fill="#28323c" font-family="Cambria Math, Microsoft YaHei, serif" font-size="28" font-style="italic">+z</text>

  <circle cx="1210" cy="520" r="10" fill="#d96b29"/>
  <line x1="1210" y1="520" x2="1210" y2="565" stroke="#d96b29" stroke-width="2"/>
  <text x="1183" y="600" fill="#c65c20" font-family="Cambria Math, Microsoft YaHei, serif" font-size="27" font-style="italic">ξ</text>

  <line x1="1210" y1="510" x2="1380" y2="510" stroke="#2b73b5" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="1275" y="498" fill="#2b73b5" font-family="Cambria Math, Microsoft YaHei, serif" font-size="23">r = x−ξ</text>

  <circle cx="1020" cy="520" r="7" fill="#15956f"/>
  <text x="987" y="557" fill="#08785a" font-family="Cambria Math, Microsoft YaHei, serif" font-size="22">x &lt; ξ</text>
  <line x1="1020" y1="505" x2="1020" y2="430" stroke="#15956f" stroke-width="4" marker-end="url(#arrow-up)"/>
  <text x="1033" y="447" fill="#08785a" font-family="Cambria Math, Microsoft YaHei, serif" font-size="24" font-style="italic">dw</text>

  <circle cx="1380" cy="520" r="7" fill="#2b73b5"/>
  <text x="1344" y="557" fill="#1f5f9a" font-family="Cambria Math, Microsoft YaHei, serif" font-size="22">x &gt; ξ</text>
  <line x1="1380" y1="535" x2="1380" y2="610" stroke="#2b73b5" stroke-width="4" marker-end="url(#arrow-down)"/>
  <text x="1393" y="595" fill="#1f5f9a" font-family="Cambria Math, Microsoft YaHei, serif" font-size="24" font-style="italic">dw</text>
</svg>
